[project]
name = "spritegpt"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "tqdm>=4.68.3",
    "torch>=2.9",
    "transformers>=5.13.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
